name: PrivGvard CI/CD — Multiplatform Matrix

on:
  push:
    branches: [ "main", "dev", "master" ]
  pull_request:
    branches: [ "main", "dev", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore CamMicBlocker.sln

    - name: Build Solution
      run: dotnet build CamMicBlocker.sln -c Release --no-restore

    - name: Run Domain Tests (Cross-Platform)
      run: dotnet test tests/PrivLock.Domain.Tests/PrivLock.Domain.Tests.csproj -c Release --no-build --verbosity normal

    - name: Run Application Tests (Cross-Platform)
      run: dotnet test tests/PrivLock.Application.Tests/PrivLock.Application.Tests.csproj -c Release --no-build --verbosity normal

    - name: Run Infrastructure Tests (Cross-Platform)
      run: dotnet test tests/PrivLock.Infrastructure.Tests/PrivLock.Infrastructure.Tests.csproj -c Release --no-build --verbosity normal

    - name: Run Windows Platform Tests
      if: runner.os == 'Windows'
      run: dotnet test tests/PrivLock.Platform.Windows.Tests/PrivLock.Platform.Windows.Tests.csproj -c Release --no-build --verbosity normal

  publish-artifacts:
    name: Publish Single-File (${{ matrix.target.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows-latest, rid: win-x64, name: PrivGvard-win-x64.exe }
          - { os: windows-latest, rid: win-arm64, name: PrivGvard-win-arm64.exe }
          - { os: ubuntu-latest, rid: linux-x64, name: PrivGvard-linux-x64 }
          - { os: macos-latest, rid: osx-arm64, name: PrivGvard-osx-arm64 }

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Single-File Executable
      run: >
        dotnet publish src/PrivLock.Desktop/PrivLock.Desktop.csproj
        -c Release
        -r ${{ matrix.target.rid }}
        --self-contained
        -p:PublishSingleFile=true
        -p:EnableCompressionInSingleFile=true
        -o publish_out/${{ matrix.target.rid }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrivGvard-${{ matrix.target.rid }}
        path: publish_out/${{ matrix.target.rid }}/*
